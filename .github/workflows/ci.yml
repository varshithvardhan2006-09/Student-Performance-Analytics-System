name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: backend
      - name: Syntax check
        run: npm run test:syntax
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Test
        run: npm test
        working-directory: backend
